# Manage multiple connexions with default values
events {}

# Contains the web server directives
http {
	# Loads the list that maps file extensions to file types (.css -> text/css)
	include /etc/nginx/mime.types;

	# Defines a virtual site, here anacharp.42.fr
	server {
		# SSL/TLS configuration
		# Listen on 443 port and wait for HTTPS, so HTTP (port 80) is refused
		listen 443 ssl;
		# Only these two versions of TLS are allowed
		ssl_protocols TLSv1.2 TLSv1.3;
		# Paths to the certificate and key generated in the Dockerfile
		ssl_certificate /etc/nginx/ssl/inception.crt;
		ssl_certificate_key /etc/nginx/ssl/inception.key;

		# The directory where Nginx looks for files to serve. This is where 
		# the WordPress volume is mounted, so Nginx sees the same files as 
		# the WordPress container.
		root /var/www/html;
		server_name anacharp.42.fr;
		# When the URL points to a directory, Nginx tries these files in this order
		# WordPress uses index.php
		index index.php index.html index.htm;

		# Add rules for URL. Test if a file exist with this path, then test if a
		# directory exist. If not : error 404.
		location / {
			try_files $uri $uri/ =404;
		}

		# Add rules for URL ending with .php : include a file fixing FastCGI parameters
		# Then Nginx ask php-fpm for execute PHP on port 9000
		location ~ \.php$ {
			include snippets/fastcgi-php.conf;
			fastcgi_pass wordpress:9000;
		}
	}
}

